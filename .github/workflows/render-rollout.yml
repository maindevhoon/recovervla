name: render-rollout

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Scene seed to record
        default: "104"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OSMesa, EGL, and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libegl1 ffmpeg
      - name: Install simulation extra
        run: pip install -e ".[sim]"
      - name: Fetch pinned robot assets
        run: python scripts/fetch_assets.py
      - name: Record seed rollout
        run: |
          mkdir -p artifacts/preview
          seed=${{ github.event.inputs.seed || '104' }}
          python scripts/render_rollout.py \
            --seed "$seed" \
            --camera workspace \
            --video-fps 20 \
            --output artifacts/preview/seed-${seed}-workspace.mp4 \
            --timeout 180
          ffmpeg -y -loglevel error -i artifacts/preview/seed-${seed}-workspace.mp4 \
            -vf "fps=1/4,scale=640:-1" artifacts/preview/seed-${seed}-still-%02d.jpg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-${{ github.event.inputs.seed || '104' }}-rollout
          path: |
            artifacts/preview/seed-*.mp4
            artifacts/preview/seed-*.json
            artifacts/preview/seed-*.jpg
          if-no-files-found: error
